# Historical nested workflow from the original ZIP. The package-root
# .github/workflows/postgres-validation.yml is now authoritative.
name: Database contract tests (historical nested configuration)
on:
  push:
  pull_request:
jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartpro
          POSTGRES_PASSWORD: demo_ci_only
          POSTGRES_DB: smartpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartpro -d smartpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://smartpro:demo_ci_only@127.0.0.1:5432/smartpro_test
      ALLOW_SMARTPRO_TEST_DB: YES
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Static inspection
        run: python3 tests/static_lint.py
      - name: Execute database migrations and contract tests
        run: bash ./run-tests.sh
