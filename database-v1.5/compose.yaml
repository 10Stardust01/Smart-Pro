# Local development ONLY. Do not use these credentials for production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartpro
      POSTGRES_PASSWORD: smartpro_local_only
      POSTGRES_DB: smartpro_test
    ports:
      - "127.0.0.1:54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpro -d smartpro_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - smartpro_pgdata:/var/lib/postgresql/data
volumes:
  smartpro_pgdata:
