name: SMART-PRO single eight-client 256KiB synthetic academic write contention
on:
  push:
    branches:
      - acceptance/hosted-bounded-eight-academic-writes-20261111
    paths:
      - .github/workflows/one-time-eight-client-writes.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  eight-client-academic-writes:
    if: github.repository == '10Stardust01/Smart-Pro' && github.ref == 'refs/heads/acceptance/hosted-bounded-eight-academic-writes-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
      SMARTPRO_HOSTED_WRITE_APPROVAL: RUN_SYNTHETIC_HOSTED_WRITES
      SMARTPRO_WRITE_DEPARTMENT_ID: 10000000-0000-4000-8000-000000000001
      SMARTPRO_WRITE_OFFERING_ID: 8b40a6e1-419d-43c8-b625-279f82713b02
      SMARTPRO_WRITE_TEAM_ID: 04da071d-f86b-415d-a580-123ba8f2236b
      SMARTPRO_WRITE_GUIDE_USER_ID: 00000000-0000-4000-8000-000000000003
      SMARTPRO_WRITE_STAGE_KEY: evidence
      SMARTPRO_WRITE_UPLOAD_CLIENTS: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Syntax and read-only local harness sanity
        run: |
          python -m py_compile scripts/hosted_eight_client_academic_writes.py
          python scripts/hosted_eight_client_academic_writes.py --self-test
      - name: One synthetic project, eight simultaneous large private PDFs and bounded academic races
        run: python scripts/hosted_eight_client_academic_writes.py
