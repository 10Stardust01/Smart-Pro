name: SMART-PRO staging syntax and boot checks
on:
  push:
    branches: [deployment/reviewer-staging]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "requirements-lock.txt"
      - ".github/workflows/staging-checks.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install hosted application dependencies
        run: python -m pip install -r backend/requirements-render.txt
      - name: Compile source without accessing a database
        run: python -m compileall -q backend scripts
      - name: Parse frontend module without executing it
        run: |
          cp frontend/app.js /tmp/smartpro-app.mjs
          node --check /tmp/smartpro-app.mjs
      - name: Check Django staging startup wiring
        env:
          PYTHONPATH: backend
          DJANGO_SETTINGS_MODULE: smartpro.settings
          DJANGO_SECRET_KEY: "testonly0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmn"
          DATABASE_URL: "postgresql://no_user:no_password@127.0.0.1:5432/no_db"
          SMARTPRO_DEPLOYMENT: "staging"
          SMARTPRO_ALLOWED_HOSTS: "smartpro.example.test"
          SMARTPRO_STAGING_REVIEWER_AUTH: "YES"
          SMARTPRO_REVIEWER_ACCOUNTS: '{"student":{"actor":"00000000-0000-4000-8000-000000000001","passwordHash":"pbkdf2_sha256$100000$salt$2ezm"}}'
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          from django.urls import resolve
          assert settings.STAGING_REVIEWER_AUTH
          assert 'smartpro.reviewer_auth.ReviewerAuthentication' in settings.REST_FRAMEWORK['DEFAULT_AUTHENTICATION_CLASSES']
          assert resolve('/reviewer/login').url_name is None
          from smartpro.reviewer_auth import reviewer_session, ReviewerAuthentication
          print('Staging Django URL and authentication configuration imports')
          PY
