name: SMART-PRO one-time signed keyboard focus and navigation smoke
on:
  push:
    branches:
      - acceptance/live-keyboard-smoke-20261111
    paths:
      - .github/workflows/live-keyboard-smoke.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMARTPRO_KEYBOARD_APPROVAL: VERIFY_READ_ONLY_SIGNED_KEYBOARD_STAGING
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/one_time_hosted_keyboard_smoke.py
      - run: |
          python -m pip install playwright==1.64.1
          python -m playwright install chromium
      - name: Real-hosted signed keyboard-only navigation and skip link
        run: python scripts/one_time_hosted_keyboard_smoke.py
