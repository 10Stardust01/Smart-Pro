name: SMART-PRO hosted published correction journey (MANUAL, free)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type RUN_SYNTHETIC_PUBLISHED_CORRECTION to authorize one isolated synthetic offering, team, project and versioned releases'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  correction:
    if: inputs.approval == 'RUN_SYNTHETIC_PUBLISHED_CORRECTION'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
      SMARTPRO_HOSTED_CORRECTION_APPROVAL: ${{ inputs.approval }}
      SMARTPRO_HOSTED_WRITE_APPROVAL: RUN_SYNTHETIC_HOSTED_WRITES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Bounded workflow safety preflight without network writes
        run: |
          python -m py_compile scripts/hosted_published_correction_journey.py
          python scripts/hosted_published_correction_journey.py --self-test
      - name: Exercise actual signed hosted Guide-Coordinator-Student correction journey
        run: python scripts/hosted_published_correction_journey.py
