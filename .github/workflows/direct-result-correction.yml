name: SMART-PRO direct result correction PostgreSQL contracts
on:
  push:
    branches: ['main', 'review/live-staging-audit-20261109']
    paths:
      - 'proposals/curriculum/059_published_correction_authority.sql'
      - 'proposals/curriculum/060_published_stage_evidence_rerelease.sql'
      - 'proposals/curriculum/061_published_correction_read_visibility.sql'
      - 'proposals/curriculum/062_paged_published_correction_reads.sql'
      - 'proposals/curriculum/063_department_faculty_management.sql'
      - 'backend/smartpro/setup_views.py'
      - 'frontend/setup.js'
      - 'scripts/test_course_workflow.py'
      - 'scripts/hosted_public_smoke.py'
      - 'scripts/ci_course_direct_correction.py'
      - 'backend/smartpro/course_views.py'
      - 'frontend/documents.js'
      - 'frontend/course-management.js'
      - 'frontend/app.js'
      - '.github/workflows/direct-result-correction.yml'
  pull_request:
    paths:
      - 'proposals/curriculum/059_published_correction_authority.sql'
      - 'proposals/curriculum/060_published_stage_evidence_rerelease.sql'
      - 'proposals/curriculum/061_published_correction_read_visibility.sql'
      - 'proposals/curriculum/062_paged_published_correction_reads.sql'
      - 'proposals/curriculum/063_department_faculty_management.sql'
      - 'backend/smartpro/setup_views.py'
      - 'frontend/setup.js'
      - 'scripts/test_course_workflow.py'
      - 'scripts/hosted_public_smoke.py'
      - 'scripts/ci_course_direct_correction.py'
      - 'backend/smartpro/course_views.py'
      - 'frontend/documents.js'
      - 'frontend/course-management.js'
      - 'frontend/app.js'
      - '.github/workflows/direct-result-correction.yml'
permissions:
  contents: read
jobs:
  direct-correction-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartpro_owner
          POSTGRES_PASSWORD: synthetic_ci_owner_only
          POSTGRES_DB: smartpro_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U smartpro_owner -d smartpro_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://smartpro_owner:synthetic_ci_owner_only@127.0.0.1:5432/smartpro_test
      DATABASE_URL: postgresql://smartpro_api:synthetic_ci_app_only@127.0.0.1:5432/smartpro_test
      ALLOW_SMARTPRO_TEST_DB: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
      DJANGO_SECRET_KEY: synthetic-only-direct-correction-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt -r backend/requirements.txt
      - name: Verify course endpoint Python syntax
        run: python -m py_compile backend/smartpro/course_views.py
      - name: Install synthetic schema and validate direct correction
        run: python scripts/ci_course_direct_correction.py
      - name: Install browser for actual Django and PostgreSQL integration
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install chromium
      - name: Exercise actual SMART-PRO Guide and Coordinator screens
        run: python scripts/test_course_workflow.py test_browser_direct_result_correction_actual_django_postgres
      - name: Exercise HTTPS signed reviewer login and stage-evidence UI with disposable PostgreSQL
        run: python scripts/test_course_workflow.py test_browser_https_reviewer_stage_evidence_actual_django_postgres
      - name: Verify redirect-header handling without network access
        run: python scripts/test_hosted_public_smoke.py
      - name: Read-only smoke of deployed SMART-PRO HTTPS and authorization boundary
        run: python scripts/hosted_public_smoke.py
