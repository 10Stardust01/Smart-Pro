name: SMART-PRO one-time postdeploy actual CSS and signed axe scan (free)
on:
  push:
    branches:
      - acceptance/hosted-postdeploy-axe-no-overrides-20261111
    paths:
      - .github/workflows/postdeploy-axe-real-css.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  actual-hosted-accessibility:
    if: github.repository == '10Stardust01/Smart-Pro' && github.ref == 'refs/heads/acceptance/hosted-postdeploy-axe-no-overrides-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_AXE_APPROVAL: RUN_READ_ONLY_AXE_SYNTHETIC_STAGING
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated scanner syntax
        run: python -m py_compile scripts/postdeploy_real_axe_audit.py
      - name: Install free pinned Chromium and axe-core without OS package upgrades
        run: |
          python -m pip install playwright==1.64.1 httpx==0.28.1
          python -m playwright install chromium
          npm install --no-save --ignore-scripts axe-core@4.10.3
      - name: Check real served CSS, five signed workspaces and WCAG automation without style override
        run: python scripts/postdeploy_real_axe_audit.py
