name: SMART-PRO hosted reviewer authenticated smoke (manual, free)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-auth-smoke
  cancel-in-progress: false
jobs:
  reviewer-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Playwright
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Test actual HTTPS signed-session boundaries
        env:
          SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
        run: python scripts/hosted_reviewer_authenticated_smoke.py
