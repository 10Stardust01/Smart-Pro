name: SMART-PRO one-time approved hosted overall correction acceptance
on:
  push:
    branches:
      - acceptance/one-time-hosted-correction-20261111
    paths:
      - .github/workflows/one-time-hosted-correction-acceptance-20261111.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  verified-correction:
    # Exactly one author-approved commit triggers this temporary workflow.
    if: github.repository == '10Stardust01/Smart-Pro' && github.event.head_commit.message == 'Run one-time approved hosted correction acceptance 20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
      SMARTPRO_HOSTED_CORRECTION_APPROVAL: RUN_SYNTHETIC_PUBLISHED_CORRECTION
      SMARTPRO_HOSTED_WRITE_APPROVAL: RUN_SYNTHETIC_HOSTED_WRITES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Verify approved bounded synthetic correction workflow preflight
        run: |
          python -m py_compile scripts/hosted_published_correction_journey.py
          python scripts/hosted_published_correction_journey.py --self-test
      - name: Exercise signed HTTPS Guide to Coordinator to Student correction
        run: python scripts/hosted_published_correction_journey.py
