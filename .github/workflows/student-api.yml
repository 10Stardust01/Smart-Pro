name: Student curriculum API
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  student-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartpro_owner
          POSTGRES_PASSWORD: synthetic_ci_owner_only
          POSTGRES_DB: smartpro_test_student_api
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U smartpro_owner -d smartpro_test_student_api"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://smartpro_owner:synthetic_ci_owner_only@127.0.0.1:5432/smartpro_test_student_api
      DATABASE_URL: postgresql://smartpro_api:synthetic_ci_app_only@127.0.0.1:5432/smartpro_test_student_api
      ALLOW_SMARTPRO_TEST_DB: 'YES'
      DJANGO_SECRET_KEY: synthetic-ci-student-api-only-key
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q --junitxml=evidence/student-api.xml -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-api-evidence
          path: evidence/student-api.xml
