name: SMART-PRO one-time signed five-role keyboard accessibility smoke
on:
  push:
    branches:
      - acceptance/hosted-keyboard-five-role-20261111
    paths:
      - .github/workflows/one-time-hosted-keyboard-smoke.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  keyboard:
    if: github.repository == '10Stardust01/Smart-Pro' && github.ref == 'refs/heads/acceptance/hosted-keyboard-five-role-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_KEYBOARD_APPROVAL: RUN_READONLY_FIVE_ROLE_KEYBOARD
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/one_time_hosted_keyboard_audit.py
      - run: |
          python -m pip install playwright==1.64.1
          python -m playwright install chromium
      - name: Read-only actual hosted keyboard focus, skip link, landmarks
        run: python scripts/one_time_hosted_keyboard_audit.py
