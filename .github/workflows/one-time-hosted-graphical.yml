name: SMART-PRO one-time hosted graphical correction acceptance (synthetic, free)
on:
  push:
    branches:
      - acceptance/one-time-hosted-graphical-20261111
    paths:
      - .github/workflows/one-time-hosted-graphical.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  graphical-correction:
    if: github.repository == '10Stardust01/Smart-Pro' && github.ref == 'refs/heads/acceptance/one-time-hosted-graphical-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMARTPRO_GUI_APPROVAL: RUN_SYNTHETIC_GRAPHICAL_CORRECTION_20261111
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local syntax safety preflight
        run: python -m py_compile scripts/hosted_graphical_correction_acceptance.py
      - name: Install pinned, free browser dependencies
        run: |
          python -m pip install httpx==0.28.1 playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Exercise actual signed graphical Guide Coordinator Student correction once
        run: python scripts/hosted_graphical_correction_acceptance.py
