name: SMART-PRO one-time signed five-role automated WCAG audit (free, read-only)
on:
  push:
    branches:
      - acceptance/one-time-axe-accessibility-20261111
    paths:
      - .github/workflows/one-time-axe-accessibility.yml
      - scripts/one_time_hosted_axe_audit.py
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == '10Stardust01/Smart-Pro' && github.ref == 'refs/heads/acceptance/one-time-axe-accessibility-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_AXE_APPROVAL: RUN_READ_ONLY_AXE_SYNTHETIC_STAGING
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight script syntax
        run: python -m py_compile scripts/one_time_hosted_axe_audit.py
      - name: Install pinned free browser and axe scanner
        run: |
          python -m pip install playwright==1.64.1 httpx==0.28.1
          python -m playwright install chromium
          npm install --no-save --ignore-scripts axe-core@4.10.3
      - name: Run authorized five-role non-mutating WCAG 2 A/AA and 2.1 A/AA automated scan
        run: python scripts/one_time_hosted_axe_audit.py
