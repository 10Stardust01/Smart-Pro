name: SMART-PRO one-time eight distinct-project PDF upload capacity (Free)
on:
  push:
    branches:
      - acceptance/hosted-eight-independent-project-uploads-20261111
    paths:
      - .github/workflows/one-time-eight-distinct-uploads.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == '10Stardust01/Smart-Pro' && github.ref == 'refs/heads/acceptance/hosted-eight-independent-project-uploads-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_EIGHT_PROJECT_APPROVAL: RUN_EIGHT_DISTINCT_SYNTHETIC_PROJECT_UPLOADS
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python -m py_compile scripts/hosted_eight_distinct_project_uploads.py
      - name: Exactly eight synthetic projects one upload per project with SHA256 verification
        run: python scripts/hosted_eight_distinct_project_uploads.py
