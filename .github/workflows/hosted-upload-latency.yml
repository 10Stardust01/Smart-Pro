name: SMART-PRO HTTPS PDF upload latency diagnostics (MANUAL, free)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type RUN_SYNTHETIC_HOSTED_WRITES to authorize a new synthetic project and 6–20 permanent immutable PDFs'
        required: true
        type: string
      upload_clients:
        description: 'Concurrent signed-in Student sessions, no uncontrolled ramp'
        required: true
        default: '2'
        type: choice
        options: ['2', '4']
      rounds:
        description: 'Repeated independent HTTPS upload waves'
        required: true
        default: '5'
        type: choice
        options: ['3', '5']
      pdf_size_kib:
        description: 'Approximate synthetic PDF size per upload'
        required: true
        default: '256'
        type: choice
        options: ['64', '256', '1024']
      department_id:
        description: 'Pre-existing synthetic staging department UUID'
        required: true
        default: '10000000-0000-4000-8000-000000000001'
        type: string
      offering_id:
        description: 'Approved active synthetic staging offering UUID'
        required: true
        default: '8b40a6e1-419d-43c8-b625-279f82713b02'
        type: string
      team_id:
        description: 'Existing active synthetic Student team, no membership changes'
        required: true
        default: '04da071d-f86b-415d-a580-123ba8f2236b'
        type: string
      guide_user_id:
        description: 'Existing synthetic Faculty actor UUID'
        required: true
        default: '00000000-0000-4000-8000-000000000003'
        type: string
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  diagnostic:
    if: inputs.approval == 'RUN_SYNTHETIC_HOSTED_WRITES'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
      SMARTPRO_HOSTED_WRITE_APPROVAL: ${{ inputs.approval }}
      SMARTPRO_WRITE_DEPARTMENT_ID: ${{ inputs.department_id }}
      SMARTPRO_WRITE_OFFERING_ID: ${{ inputs.offering_id }}
      SMARTPRO_WRITE_TEAM_ID: ${{ inputs.team_id }}
      SMARTPRO_WRITE_GUIDE_USER_ID: ${{ inputs.guide_user_id }}
      SMARTPRO_WRITE_UPLOAD_CLIENTS: ${{ inputs.upload_clients }}
      SMARTPRO_UPLOAD_PERF_ROUNDS: ${{ inputs.rounds }}
      SMARTPRO_UPLOAD_PERF_SIZE_KIB: ${{ inputs.pdf_size_kib }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Validate bounded benchmark without network writes
        run: |
          python -m py_compile scripts/hosted_upload_latency_diagnostic.py scripts/hosted_synthetic_https_writes.py
          python scripts/hosted_upload_latency_diagnostic.py --self-test
      - name: Sample actual HTTPS uploads and verify immutable file bytes
        run: python scripts/hosted_upload_latency_diagnostic.py
