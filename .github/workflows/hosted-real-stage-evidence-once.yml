name: SMART-PRO one-time real hosted stage-evidence correction and re-release
on:
  push:
    branches:
      - acceptance/hosted-stage-evidence-real-20261111
    paths:
      - .github/workflows/hosted-real-stage-evidence-once.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  bounded-synthetic-stage-correction:
    if: github.repository == '10Stardust01/Smart-Pro' && github.ref == 'refs/heads/acceptance/hosted-stage-evidence-real-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_HOSTED_CORRECTION_APPROVAL: RUN_SYNTHETIC_REAL_STAGE_EVIDENCE
      SMARTPRO_HOSTED_WRITE_APPROVAL: RUN_SYNTHETIC_HOSTED_WRITES
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned free HTTPS runtime without browser
        run: python -m pip install httpx==0.28.1
      - name: Validate unique synthetic-only lifecycle script locally
        run: |
          python -m py_compile scripts/hosted_real_stage_evidence_acceptance.py
          python scripts/hosted_real_stage_evidence_acceptance.py --self-test
      - name: One original immutable project; new correction-enabled synthetic project only
        run: python scripts/hosted_real_stage_evidence_acceptance.py
