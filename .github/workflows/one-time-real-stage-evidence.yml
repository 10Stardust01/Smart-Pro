name: SMART-PRO one-time hosted real corrected stage evidence and overall re-release
on:
  push:
    branches:
      - acceptance/one-time-real-stage-evidence-20261111
    paths:
      - .github/workflows/one-time-real-stage-evidence.yml
permissions:
  contents: read
concurrency:
  group: smartpro-hosted-academic-writes-single-run
  cancel-in-progress: false
jobs:
  signed-actual-https:
    if: github.repository == '10Stardust01/Smart-Pro' && github.ref == 'refs/heads/acceptance/one-time-real-stage-evidence-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMARTPRO_HOSTED_TEST_ACCOUNTS: ${{ secrets.SMARTPRO_HOSTED_TEST_ACCOUNTS }}
      SMARTPRO_HOSTED_CORRECTION_APPROVAL: RUN_SYNTHETIC_TRUE_FLAG_STAGE_EVIDENCE
      SMARTPRO_HOSTED_WRITE_APPROVAL: RUN_SYNTHETIC_HOSTED_WRITES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Syntax and bounded staging safety preflight
        run: |
          python -m py_compile scripts/hosted_genuine_stage_evidence_journey.py
          python scripts/hosted_genuine_stage_evidence_journey.py --self-test
      - name: One new synthetic correction-enabled framework and actual signed role correction
        run: python scripts/hosted_genuine_stage_evidence_journey.py
